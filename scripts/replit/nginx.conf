worker_processes 1;
error_log stderr warn;
pid /tmp/mcod-nginx.pid;

events {
    worker_connections 512;
}

http {
    types {
        text/html html htm;
        text/css css;
        application/javascript js mjs;
        application/json json map;
        image/png png;
        image/jpeg jpg jpeg;
        image/gif gif;
        image/svg+xml svg;
        image/x-icon ico;
        image/webp webp;
        font/woff woff;
        font/woff2 woff2;
        font/ttf ttf;
        application/pdf pdf;
    }
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    client_max_body_size 26m;

    server {
        listen 0.0.0.0:5000;
        server_name _;

        location = /api {
            return 308 /api/;
        }

        location ^~ /api/ {
            proxy_pass http://127.0.0.1:8000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location ^~ /static/ {
            alias @STATIC_ROOT@/;
            expires 1h;
            add_header Cache-Control "public";
        }

        location ^~ /media/ {
            proxy_pass http://127.0.0.1:8001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        # The publish probe needs HTTP 200 at /. For an anonymous request,
        # display the real login page instead of its redirect. Authenticated
        # dashboard responses and protection on every other route are unchanged.
        location = / {
            proxy_pass http://127.0.0.1:8001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_intercept_errors on;
            error_page 302 = /login/?next=/;
        }

        location / {
            proxy_pass http://127.0.0.1:8001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
